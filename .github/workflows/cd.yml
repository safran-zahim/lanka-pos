name: CD

on:
  push:
    branches: [ main ]

jobs:
  build-push-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swap to Postgres Schema
        run: cp prisma/schema.postgresql.prisma prisma/schema.prisma

      - name: Log in to Docker Hub
        # Only login if secrets are available
        if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: docker build . --file Dockerfile --tag ${{ secrets.DOCKER_USERNAME }}/lanka-pos-backend:latest
        if: ${{ secrets.DOCKER_USERNAME }}

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/lanka-pos-backend:latest
        if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}

  build-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: docker build ./client --file ./client/Dockerfile --tag ${{ secrets.DOCKER_USERNAME }}/lanka-pos-frontend:latest
        if: ${{ secrets.DOCKER_USERNAME }}
        
      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/lanka-pos-frontend:latest
        if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
